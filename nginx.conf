# nginx imajı bu dosyayı /etc/nginx/templates altından okur ve açılışta ${ADMIN_API_URL}
# değerini ortam değişkeninden doldurur. Diğer $değişkenler nginx'e aynen kalır.

# Traefik TLS'i sonlandırır; Laravel'e asıl şemayı (https) ilet.
map $http_x_forwarded_proto $iletilen_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evrak / soru formu dosya yüklemeleri (PHP sınırı 100M).
    client_max_body_size 100m;

    # Docker iç DNS'i: admin container'ı yeniden deploy edilince adı yeniden çözülür,
    # admin kapalıyken de portal açılmaya devam eder.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API, dışarıya kapalı admin uygulamasına Docker ağı üzerinden iletilir.
    # X-Forwarded-For / X-Real-IP, Traefik'ten geldiği gibi aktarılır: Laravel yalnızca bir önceki
    # proxy'ye güvendiği için zincire Traefik IP'si eklenirse IP bazlı sınırlar tüm kullanıcılara ortak olur.
    location /api/ {
        set $admin_api ${ADMIN_API_URL};
        proxy_pass $admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $iletilen_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # SPA: client-side routes (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets; HTML always revalidated
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
